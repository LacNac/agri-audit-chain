<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập Quản trị | AgriTrace</title>
    <!-- Nhúng Font Be Vietnam Pro đồng nhất toàn hệ thống -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-gradient: linear-gradient(135deg, #0f0c31 0%, #1d12c3 100%);
        --panel-bg: #ffffff;
        --primary: #1d12c3;
        --primary-hover: #140b91;
        --text-color: #1a1b2e;
        --muted-color: #6d6d7c;
        --border-color: #e2e8f0;
        --danger-color: #ef4444;
        --shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--bg-gradient);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        color: var(--text-color);
      }

      .login-card {
        background: var(--panel-bg);
        width: 100%;
        max-width: 420px;
        border-radius: 20px;
        padding: 40px 32px;
        box-shadow: var(--shadow);
      }

      /* Logo thương hiệu từ assets */
      .brand-header {
        text-align: center;
        margin-bottom: 32px;
      }

      .brand-logo-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .brand-icon {
        height: 42px;
        width: auto;
      }

      .brand-text-logo {
        height: 28px;
        width: auto;
      }

      .brand-subtitle {
        margin: 8px 0 0;
        font-size: 0.875rem;
        color: var(--muted-color);
        font-weight: 500;
      }

      .login-form {
        display: grid;
        gap: 20px;
      }

      .form-group {
        display: grid;
        gap: 8px;
      }

      .form-group label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-color);
      }

      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .form-input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        font-size: 0.95rem;
        font-family: inherit;
        transition: all 0.2s ease;
      }

      .form-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(29, 18, 195, 0.1);
      }

      .toggle-password {
        position: absolute;
        right: 12px;
        background: none;
        border: none;
        color: var(--muted-color);
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 600;
        padding: 4px;
        font-family: inherit;
      }

      .submit-btn {
        width: 100%;
        padding: 14px;
        background: var(--primary);
        color: #ffffff;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.2s ease;
        margin-top: 8px;
      }

      .submit-btn:hover {
        background: var(--primary-hover);
      }

      .submit-btn:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      .error-message {
        min-height: 20px;
        color: var(--danger-color);
        font-size: 0.85rem;
        text-align: center;
        margin: 0;
        font-weight: 500;
      }

      .footer-note {
        text-align: center;
        margin-top: 24px;
        font-size: 0.8rem;
        color: var(--muted-color);
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="brand-header">
        <!-- Thay thế bằng 2 logo SVG của dự án trong assets -->
        <div class="brand-logo-wrap">
          <img src="./assets/logo-icon.svg" alt="AgriTrace Icon" class="brand-icon" />
          <img src="./assets/logo-text.svg" alt="AgriTrace" class="brand-text-logo" />
        </div>
        <p class="brand-subtitle">Cổng Quản Trị Hệ Thống (Admin)</p>
      </div>

      <form id="adminLoginForm" class="login-form">
        <div class="form-group">
          <label for="adminEmail">Email quản trị</label>
          <input
            type="email"
            id="adminEmail"
            name="email"
            class="form-input"
            placeholder="admin@agritrace.vn"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="adminPassword">Mật khẩu</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="adminPassword"
              name="password"
              class="form-input"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            />
            <button type="button" id="togglePasswordBtn" class="toggle-password">Hiện</button>
          </div>
        </div>

        <p id="errorMessage" class="error-message" aria-live="polite"></p>

        <button type="submit" id="submitBtn" class="submit-btn">Đăng nhập Admin</button>
      </form>

      <div class="footer-note">
        &copy; 2026 AgriTrace Platform. Chỉ dành cho nhân sự quản trị.
      </div>
    </div>

    <script src="./js/admin_login.js"></script>
  </body>
</html>
