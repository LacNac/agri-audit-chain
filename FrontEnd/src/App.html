<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriTrace</title>
    <link rel="stylesheet" href="App.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo-group">
        <img src="./assets/name.svg" alt="Logo AgriTrace" class="logo" />
        <img src="./assets/Agritrace.svg" alt="..." class="logo2" />
      </div>

      <ul class="nav-menu">
        <li><a href="#">Trang chủ</a></li>
        <li><a href="#">Sản phẩm</a></li>
        <li><a href="#">Về chúng tôi</a></li>
      </ul>

      <div class="nav-login">
        <a href="index.html">Đăng nhập</a>
        <button>Tạo tài khoản miễn phí →</button>
      </div>
    </nav>

    <div class="ticks"></div>
    <section id="spacer"></section>

    <main class="introduce">
      <section class="hero">
        <div class="trace">
          <p class="up">NỀN TẢNG HỒ SƠ SỐ NÔNG SẢN</p>
          <h1 class="hero-title">
            MỖI NÔNG SẢN. <br />
            <span class="purple-text">MỘT DANH TÍNH SỐ.</span>
          </h1>
          <p class="down">
            Số hóa quy trình canh tác, chuỗi cung ứng và kiểm định chất lượng
            thành hồ sơ số minh bạch, giúp nông sản Việt tự tin vươn xa.
          </p>
          <div class="check">
            <button>Quét mã truy xuất</button>
            <button>Tìm kiếm mã nông sản</button>
          </div>
          <p class="trust-text">
            Chuỗi khối an toàn • Mã QR định danh • Dữ liệu bất biến
          </p>
        </div>
        <div class="hero-image">
          <img src="./assets/fruit.svg" alt="" class="fruit" />
        </div>
      </section>

      <div class="floating-actions">
        <button class="fab-btn qr-btn">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
          </svg>
        </button>

        <button class="fab-btn bot-btn">
          <img
            src="https://api.dicebear.com/7.x/bottts/svg?seed=AgriBotPurple"
            alt="Bot Support"
          />
        </button>

        <button class="fab-btn call-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.46.57 3.58a1 1 0 01-.24 1.01l-2.21 2.2z"
            />
          </svg>
        </button>
      </div>
    </main>
  </body>
</html>
