<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | AgriTrace</title>
    <style>
      :root {
        --bg: #f4f7ff;
        --panel: #ffffff;
        --primary: #1d12c3;
        --primary-2: #2b2296;
        --accent: #ffdd01;
        --text: #1a1b2e;
        --muted: #6d6d7c;
        --border: #e8ebf7;
        --success: #12b76a;
        --warning: #f59e0b;
        --danger: #ef4444;
        --shadow: 0 14px 40px rgba(28, 31, 91, 0.08);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Be Vietnam Pro", Arial, sans-serif;
        background: linear-gradient(180deg, #eef4ff 0%, #f9faff 100%);
        color: var(--text);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 32px;
        background: #fff;
        border-bottom: 1px solid var(--border);
        box-shadow: 0 4px 18px rgba(20, 28, 96, 0.04);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        color: var(--primary);
      }

      .brand-mark {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: #fff;
        font-weight: 700;
      }

      .logout-btn {
        border: none;
        background: var(--primary);
        color: white;
        border-radius: 10px;
        padding: 10px 16px;
        cursor: pointer;
        font-weight: 600;
      }

      .dashboard-shell {
        max-width: 1200px;
        margin: 32px auto;
        padding: 0 20px 40px;
      }

      .page-title {
        margin: 0 0 24px;
        font-size: 2rem;
        color: var(--primary);
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 18px;
        margin-bottom: 28px;
      }

      .stat-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 22px 20px;
      }

      .stat-label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .stat-value {
        font-size: 2rem;
        font-weight: 800;
        color: var(--text);
        margin: 0;
      }

      .lists {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
      }

      .list-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 20px;
      }

      .list-card h3 {
        margin-top: 0;
        color: var(--primary);
      }

      .batch-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .batch-item {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #f9faff;
      }

      .batch-item strong {
        display: block;
        font-size: 0.95rem;
      }

      .batch-item span {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .tag {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .tag.unverified { background: rgba(245, 158, 11, 0.12); color: var(--warning); }
      .tag.audited { background: rgba(18, 183, 106, 0.12); color: var(--success); }
      .tag.rejected { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

      .empty {
        color: var(--muted);
        font-style: italic;
      }

      @media (max-width: 768px) {
        .topbar {
          padding: 14px 18px;
        }
        .dashboard-shell {
          margin-top: 20px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">A</div>
        <span>AgriTrace Admin</span>
      </div>
      <button id="logoutBtn" class="logout-btn" type="button">Đăng xuất</button>
    </header>

    <main class="dashboard-shell">
      <h1 class="page-title">Dashboard quản trị</h1>

      <section class="summary-grid">
        <article class="stat-card">
          <div class="stat-label">Users</div>
          <p id="users-count" class="stat-value">0</p>
        </article>
        <article class="stat-card">
          <div class="stat-label">Farmers</div>
          <p id="farmers-count" class="stat-value">0</p>
        </article>
        <article class="stat-card">
          <div class="stat-label">Auditors</div>
          <p id="auditors-count" class="stat-value">0</p>
        </article>
        <article class="stat-card">
          <div class="stat-label">Batches</div>
          <p id="batches-count" class="stat-value">0</p>
        </article>
        <article class="stat-card">
          <div class="stat-label">Audited batches</div>
          <p id="audited-count" class="stat-value">0</p>
        </article>
        <article class="stat-card">
          <div class="stat-label">Rejected batches</div>
          <p id="rejected-count" class="stat-value">0</p>
        </article>
        <article class="stat-card">
          <div class="stat-label">Pending batches</div>
          <p id="pending-count" class="stat-value">0</p>
        </article>
      </section>

      <section class="lists">
        <article class="list-card">
          <h3>Batch mới tạo</h3>
          <ul id="new-batches" class="batch-list"></ul>
        </article>

        <article class="list-card">
          <h3>Batch đang chờ kiểm định</h3>
          <ul id="pending-batches" class="batch-list"></ul>
        </article>

        <article class="list-card">
          <h3>Batch bị reject</h3>
          <ul id="rejected-batches" class="batch-list"></ul>
        </article>
      </section>
    </main>

    <script src="./js/admin-dashboard.js"></script>
  </body>
</html>
