databases:
  - name: agri-audit-chain-db
    plan: free
    databaseName: agri_audit_chain

services:
  - type: web
    name: agri-audit-chain
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AGRI_DATABASE_URL
        fromDatabase:
          name: agri-audit-chain-db
          property: connectionString
      - key: AGRI_BLOCKCHAIN_RPC_URL
        sync: false
      - key: AGRI_BLOCKCHAIN_CONTRACT_ADDRESS
        sync: false
      - key: AGRI_BLOCKCHAIN_PRIVATE_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
